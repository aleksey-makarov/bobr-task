[package]
name = "bobr-task"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aleksey-makarov/bobr-task"
description = "Task launcher connecting ZeroClaw workers to task-local Bobr workspaces"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "process", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.23"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"

